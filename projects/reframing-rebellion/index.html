    </header><main id="main-content" class="portfolio-main page-width a-main"><article class="portfolio-content a-project-content"><div class="a-grid a-project-info"><h1 id="project-title" class="portfolio-title a-project-title" data-a-slot="1:4" style="--a-column:1;--a-span:4">Reframing Rebellion：抗议物件的重新解读与实验出版</h1><div class="portfolio-overview" data-a-slot="6:7" style="--a-column:6;--a-span:7"><p>我从安全背心、橡胶鸭与面具等抗议物件出发，研究一件日常物品换了使用方式和场景后，如何获得新的含义。七人工作坊中的一个尝试是把塑料容器穿在脚上。我沿着这个想法继续制作和拍摄，最后将物件档案、改造过程与摄影编入一本 Risograph 印刷的独立刊物。</p></div></div></article><footer class="site-footer"><span>徐渊植 / Yuanzhi Xu</span><a href="../../category/writing/">RESEARCH / WRITING</a><a href="#top">回到顶部 ↑</a></footer></main><dialog id="image-viewer" class="image-viewer" aria-labelledby="viewer-title"><div class="viewer-header"><div><h2 id="viewer-title"></h2><p id="viewer-caption"></p></div><button type="button" id="viewer-close">关闭</button></div><div class="viewer-stage"><img id="viewer-image" alt=""></div><div class="viewer-footer"><span>完整比例显示</span><span>Esc 关闭</span></div></dialog></body></html>

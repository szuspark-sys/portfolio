      <h1>Messy and Neat：文本解码与互动阅读</h1>
      <p class="messy-intro">我把关于女性主义与设计教育的段落改写成八组阅读谜题。Messy 放谜面，Neat 放对应线索，读者可以查找曲目、对照窗户的亮灭，或操作纸上的缝线来解码。早期折册难以配对，最终改成编号的独立纸页，并和海报一起展出。</p>

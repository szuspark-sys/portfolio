    </header><main id="main-content" class="portfolio-main page-width a-main"><article class="portfolio-content a-project-content"><div class="a-grid a-project-info"><h1 id="project-title" class="portfolio-title a-project-title" data-a-slot="1:4" style="--a-column:1;--a-span:4">一把危险的椅子</h1><div class="portfolio-overview" data-a-slot="6:7" style="--a-column:6;--a-span:7"><p>这套艺术与设计衔接课程以“危险的椅子”为共同主题。参与者从一个熟悉的物件出发，改变它的结构、材料或情境，随后将作品交给不同媒介继续发展，最后用说明书或 zine 讲清构想。</p><p>课程先从现成底座和椅子制作展开，再与服装环节衔接，通过穿戴或包裹改变作品，最后以平面说明书或 zine 表达。每次转换都要求参与者重新解释作品的对象、用途和观看方式。</p></div></div><div class="a-grid a-media-row a-module-halves" data-a-row="dangerous-chair-media-1" data-a-module="halves" data-a-mobile="full-width"><figure class="portfolio-image a-figure" data-media-id="C03-01" data-a-slot="1:6" style="--a-column:1;--a-span:6;--a-media-width:1900px;--a-media-ratio:1.777362" data-a-sized="">
